name: Tap Audit & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Ruby syntax
        run: |
          for f in Formula/*.rb Casks/*.rb; do
            ruby -c "$f"
          done

      - name: Validate Formula & Cask URLs and Checksums
        run: python scripts/sync_tap.py --verify
